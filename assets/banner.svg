<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners and subtle border -->
  <rect width="900" height="240" rx="16" fill="url(#bg-grad)"/>
  <rect width="898" height="238" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Icon: Modern Markdown Document Symbol with lightning -->
  <g transform="translate(60, 48)">
    <!-- Document Card -->
    <rect width="105" height="144" rx="12" fill="rgba(255,255,255,0.05)" stroke="url(#grad-accent)" stroke-width="2.5"/>
    
    <!-- M icon for Markdown -->
    <path d="M 22 84 L 22 52 L 38 68 L 54 52 L 54 84" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Down Arrow for Markdown -->
    <path d="M 75 52 L 75 78 M 65 68 L 75 78 L 85 68" fill="none" stroke="#c084fc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Feather / Speed Accent -->
    <circle cx="92" cy="120" r="4" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Main Title -->
  <text x="200" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-weight="900" font-size="76" fill="url(#grad-accent)" letter-spacing="-2px">
    zero<tspan fill="#ffffff">.md</tspan>
  </text>

  <!-- Tagline / Badge -->
  <g transform="translate(202, 148)">
    <!-- Tagline text -->
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-weight="500" font-size="18" fill="#94a3b8" letter-spacing="0.5px">
      Zero-bloat, ultra-lightweight native Markdown viewer for Linux
    </text>
  </g>

  <!-- Pills / Highlights on the right -->
  <g transform="translate(202, 195)">
    <rect width="86" height="26" rx="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
    <text x="43" y="17" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">0 MB BLOAT</text>

    <rect x="96" width="78" height="26" rx="13" fill="rgba(129, 140, 248, 0.15)" stroke="#818cf8" stroke-width="1"/>
    <text x="135" y="17" font-family="monospace" font-size="11" font-weight="bold" fill="#818cf8" text-anchor="middle">&lt; 0.2s LAUNCH</text>

    <rect x="184" width="88" height="26" rx="13" fill="rgba(192, 132, 252, 0.15)" stroke="#c084fc" stroke-width="1"/>
    <text x="228" y="17" font-family="monospace" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="middle">GTK3 NATIVE</text>
  </g>
</svg>
